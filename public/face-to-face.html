<title>元宝地雷 · 真心话大冒险</title>

  }
  @keyframes rise {

  .turn-label { font-size: 13px; opacity: .85; }
  .history { max-height: 200px; overflow-y: auto; margin-top: 8px; scrollbar-width: thin; }
  .h-item {

  .challenge-card { margin-top: 8px; }

</head>
<body>
<!-- 漂浮金币粒子装饰 -->
<div class="particles" id="particles"></div>

        <select id="selMineSide" style="flex:0 0 46%;">

      <div class="turn-box">
        <div class="turn-label">轮到</div>
        <div class="turn-name" id="turnName">—</div>

        <input id="inpGuess" type="number" placeholder="输入要猜的数字" inputmode="numeric">
        <button class="btn btn-gold btn-sm" id="btnGuess" style="flex:0 0 auto;font-size:16px;padding:13px 20px;">猜!</button>
      </div>
      <button class="btn btn-red btn-sm" id="btnRestart" style="width:100%;">重新开局</button>
    </div>

    <div class="card">
      <h2>📜 猜数记录</h2>
      <div class="history" id="historyList"></div>
    </div>
  </div>

  <div class="footer">元宝地雷 · 面对面同屏版 · 微信联机版即将上线</div>
</div>

<!-- ============ 结算弹窗 ============ -->
<div class="mask" id="resultMask">
  <div class="modal" id="resultModal">
    <div class="icon" id="resIcon">💣</div>
    <h3 id="resTitle">踩中地雷!</h3>
    <div class="sub" id="resSub">玩家「XXX」踩中地雷,接受惩罚!</div>
    <div class="chal" id="resChal">
      <div><span class="tag tag-dare" id="resTag">大冒险</span></div>
      <div id="resText">随机题目</div>
    </div>
    <div class="hint" style="color:#8a6d2a;" id="resExtra"></div>
    <button class="btn btn-gold" id="btnPlayAgain" style="margin-top:14px;">🎮 再来一局</button>
    <button class="btn btn-gray btn-sm" id="btnNextRound" style="margin-top:8px;">回房间(重新选人/设置)</button>
  </div>
</div>

<div class="toast" id="toast"></div>

  function addPlayer(game, name) {
    name = String(name || '').trim();
    if (!name) return { ok: false, error: '昵称不能为空' };
    var id = 'p' + (_uid++);
    game.players.push({ id: id, name: name });
    return { ok: true, player: { id: id, name: name } };
  }
  function removePlayer(game, playerId) {
    var idx = -1;
    for (var i = 0; i < game.players.length; i++) if (game.players[i].id === playerId) { idx = i; break; }
    if (idx === -1) return { ok: false, error: '玩家不存在' };
    game.players.splice(idx, 1);
    if (game.players.length === 0) { game.current = 0; }
    else {
      if (idx < game.current) game.current--;
      if (game.current >= game.players.length) game.current = 0;
    }
    return { ok: true };
  }
  function currentPlayer(game) {
    if (!game.players.length) return null;
    return game.players[game.current] || null;
  }
  function guess(game, playerId, n) {
    if (game.status !== 'playing') return { ok: false, error: '本局已结束,请开始新一局' };
    if (!Number.isInteger(n)) return { ok: false, error: '请输入整数' };
    var cur = currentPlayer(game);
    if (!cur) return { ok: false, error: '还没有玩家加入' };
    if (cur.id !== playerId) return { ok: false, error: '还没轮到你,当前轮到:' + cur.name };
    if (n < game.low || n > game.high) return { ok: false, error: '超出范围,当前范围是 ' + game.low + ' ~ ' + game.high };
    var hit = null;
    if (n === game.treasure) hit = 'treasure';
    else if (n === game.mine) hit = 'mine';
    if (!hit) {
      if (n === game.low || n === game.high) return { ok: false, error: '数字 ' + n + ' 已是边界,没有收窄效果,请换个数字' };
      // 收窄:猜的数保留「包含地雷」的半边(小于地雷→下界,大于地雷→上界)
      if (n < game.mine) game.low = n; else game.high = n;
    }
    game.history.push({ playerId: cur.id, name: cur.name, guess: n, low: game.low, high: game.high, hit: hit });
    if (hit === 'treasure') {
      game.status = 'finished'; game.winnerId = cur.id;
      game.result = { type: 'treasure', playerId: cur.id, name: cur.name, guess: n };
    } else if (hit === 'mine') {
      game.status = 'finished'; game.loserId = cur.id;
      game.result = { type: 'mine', playerId: cur.id, name: cur.name, guess: n };
    } else {
      game.current = (game.current + 1) % game.players.length;
    }
    return { ok: true, hit: hit, game: game };
  }
  function randomChallenge() {
    var type = Math.random() < 0.5 ? 'truth' : 'dare';
    var pool = type === 'truth' ? TRUTHS : DARES;
    return { type: type, text: pool[randInt(0, pool.length - 1)] };
  }
  function pickRewardTarget(game, winnerId) {
    var others = game.players.filter(function (p) { return p.id !== winnerId; });
    var pool = others.length > 0 ? others : game.players;
    return pool[randInt(0, pool.length - 1)];
  }
  return {
    MIN: MIN, MAX: MAX, TRUTHS: TRUTHS, DARES: DARES,
    createGame: createGame, addPlayer: addPlayer, removePlayer: removePlayer,
    currentPlayer: currentPlayer,
    guess: guess, randomChallenge: randomChallenge, pickRewardTarget: pickRewardTarget
  };
});
/* ================= UI ================= */
var G = window.GameLogic;
var game = null;
var $ = function (id) { return document.getElementById(id); };

function toast(msg) {
  var t = $('toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(t._timer); t._timer = setTimeout(function () { t.classList.remove('show'); }, 2200);
}

/* ---- 准备阶段 ---- */
function renderPlayers() {
  var list = $('playerList');
  if (!game) { list.innerHTML = '<div class="hint" style="border:none;">暂无玩家</div>'; return; }
  list.innerHTML = game.players.map(function (p) {
    return '<span class="chip">' + p.name + '<span class="x" data-id="' + p.id + '">✕</span></span>';
  }).join('');
  $('playerHint').textContent = game.players.length >= 1 ? '已加入 ' + game.players.length + ' 人,可以开局!' : '至少 1 名玩家即可开局。';
}
$('playerList').addEventListener('click', function (e) {
  var x = e.target.closest('.x'); if (!x) return;
  G.removePlayer(game, x.getAttribute('data-id'));
  renderPlayers();
});
function addPlayerByName() {
  var inp = $('inpName'); var name = inp.value.trim();
  if (!name) { toast('请输入昵称'); return; }
  if (game.players.length >= 20) { toast('最多 20 名玩家'); return; }
  var r = G.addPlayer(game, name);
  if (!r.ok) { toast(r.error); return; }
  inp.value = ''; inp.focus(); renderPlayers();
}
$('btnAdd').addEventListener('click', addPlayerByName);
$('inpName').addEventListener('keydown', function (e) { if (e.key === 'Enter') addPlayerByName(); });
$('selMode').addEventListener('change', function () {
  $('customRow').classList.toggle('hidden', this.value !== 'custom');
});
$('btnStart').addEventListener('click', function () {
  if (!game || game.players.length < 1) { toast('请先加入至少 1 名玩家'); return; }
  var mode = $('selMode').value;
  var opts = {};
  if (mode === 'custom') {
    var tv = parseInt($('inpTreasure').value, 10);
    if (isNaN(tv) || tv < 1 || tv > 100) { toast('元宝数字需在 1~100 之间'); return; }
    opts.seed = tv;
    var side = $('selMineSide').value;
    if (side === '+1' || side === '-1') opts.mineSide = side;
  }
  var g;
  try { g = G.createGame(opts); } catch (e) { toast(e.message); return; }
  g.players = game.players.slice();
  game = g;
  $('setupView').classList.add('hidden');
  $('gameView').classList.remove('hidden');
  renderGame();
});
$('inpTreasure').addEventListener('keydown', function (e) { if (e.key === 'Enter') $('btnStart').click(); });

/* ---- 游戏阶段 ---- */
function renderGame() {
  if (!game) return;
  $('rangeNum').textContent = game.low + ' ~ ' + game.high;
  var cur = G.currentPlayer(game);
  $('turnName').textContent = cur ? cur.name : '—';
  renderHistory();
}
function renderHistory() {
  var h = $('historyList');
  if (!game.history.length) { h.innerHTML = '<div class="hint">还没有人猜过。</div>'; return; }
  h.innerHTML = game.history.slice().reverse().map(function (it) {
    var cls = it.hit ? ' h-item hit' : '';
    var tag = it.hit === 'treasure' ? '🎁 元宝!' : it.hit === 'mine' ? '💣 地雷!' : '';
    return '<div class="h-item' + cls + '"><span><b>' + it.name + '</b> 猜 <span class="g">' + it.guess + '</span> ' + tag + '</span><span class="r">范围 ' + it.low + '~' + it.high + '</span></div>';
  }).join('');
  h.scrollTop = 0;
}
$('btnGuess').addEventListener('click', guessNow);
$('inpGuess').addEventListener('keydown', function (e) { if (e.key === 'Enter') guessNow(); });
function guessNow() {
  if (!game || game.status !== 'playing') return;
  var n = parseInt($('inpGuess').value, 10);
  if (isNaN(n)) { toast('请输入要猜的数字'); return; }
  var cur = G.currentPlayer(game);
  var r = G.guess(game, cur.id, n);
  if (!r.ok) { toast(r.error); $('inpGuess').value = ''; return; }
  $('inpGuess').value = '';
  renderGame();
  if (game.status === 'finished') showResult();
}
$('btnRestart').addEventListener('click', function () {
  $('gameView').classList.add('hidden');
  $('setupView').classList.remove('hidden');
  game = G.createGame();
  renderPlayers();
});

/* ---- 结算 ---- */
function showResult() {
  var res = game.result;
  var isTreasure = res.type === 'treasure';
  $('resIcon').textContent = isTreasure ? '🎁' : '💣';
  $('resTitle').textContent = isTreasure ? '踩中元宝!' : '踩中地雷!';
  var chal = res.challenge;
  var tagCls = chal.type === 'truth' ? 'tag-truth' : 'tag-dare';
  $('resTag').textContent = chal.type === 'truth' ? '真心话' : '大冒险';
  $('resTag').className = 'tag ' + tagCls;
  $('resText').textContent = chal.text;
  if (isTreasure) {
    $('resSub').textContent = '「' + res.name + '」踩中元宝获得奖励!';
    $('resExtra').textContent = '🎉 奖励:指定「' + res.targetName + '」完成下面的挑战:';
  } else {
    $('resSub').textContent = '「' + res.name + '」踩中地雷,接受惩罚!';
    $('resExtra').textContent = '💥 惩罚:请完成下面的挑战:';
  }
  $('resultMask').classList.add('show');
}
/* 再来一局:保留当前玩家,直接开新局(随机元宝) */
$('btnPlayAgain').addEventListener('click', function () {
  $('resultMask').classList.remove('show');
  var players = game.players.slice();
  var g = G.createGame();
  g.players = players;
  game = g;
  renderGame();
});

/* 回房间:重新选人/设置 */
$('btnNextRound').addEventListener('click', function () {
  $('resultMask').classList.remove('show');
  $('gameView').classList.add('hidden');
  $('setupView').classList.remove('hidden');
  game = G.createGame();
  renderPlayers();
});

/* ---- 初始化 ---- */
game = G.createGame();
renderPlayers();

/* ---- 漂浮粒子 ---- */
(function () {
  var box = document.getElementById('particles');
  if (!box) return;
  var icons = ['🪙', '💰', '💎', '✨', '🎁', '⭐', '🔥'];
  for (var i = 0; i < 14; i++) {
    var s = document.createElement('span');
    s.textContent = icons[Math.floor(Math.random() * icons.length)];
    s.style.left = (Math.random() * 100) + '%';
    s.style.fontSize = (16 + Math.random() * 22) + 'px';
    s.style.animationDuration = (8 + Math.random() * 10) + 's';
    s.style.animationDelay = (Math.random() * 8) + 's';
    box.appendChild(s);
  }
})();
</script>
